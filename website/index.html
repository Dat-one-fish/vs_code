<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizBaj</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <a class="logo" href="#" aria-label="QuizBaj home">
          <img src="images/Group 1 1.png" alt="QuizBaj" />
        </a>
        <nav class="navigation" aria-label="Main navigation">
          <a href="#">About</a>
          <a href="#">Portfolio</a>
          <a href="#">Services</a>
          <a href="#">Blog</a>
        </nav>
        <a class="contact" href="#">Contact</a>
      </header>

      <main class="hero">
        <section class="intro">
          <h1>Play Online<br />Quiz & Win<br />Cash Daily!</h1>
          <p>Win up to 1000৳ monthly from QuizBaj.</p>
          <form class="register" action="#">
            <input class="phone" type="tel" value="+880" aria-label="Phone number" />
            <button type="submit">Register now</button>
          </form>
          <div class="users">
            <p>Number of active users right now</p>
            <strong>20,000+</strong>
          </div>
        </section>
        <div class="illustration">
          <img src="images/Group 338.png" alt="People learning together" />
        </div>
      </main>
    </div>
  </body>
</html>
